<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link rel="stylesheet" type="text/css" href="/style/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/style/sticky-footer-navbar.css" />
        <link rel="stylesheet" type="text/css" href="/style/style.css" />

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>
    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav mr-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <!-- Dialog -->
            <div class="modal fade" id="modalDialog" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true" data-bs-keyboard="false" data-bs-backdrop="static">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header" id="dialogHeader">
                            <h5 class="modal-title" id="dialogTitle"></h5>
                        </div>
                        <div class="modal-body" id="dialogBody">
                        </div>
                        <div class="modal-footer" id="dialogFooter">
                        </div>
                    </div>
                </div>
            </div>
            <!-- Main view - two column layout -->
            <div class="container-fluid mt-5 px-4">
                <div class="row">
                    <!-- Main content - Plugins -->
                    <div class="col-lg-9 col-md-8">
                        <!-- Display Canvas -->
                        <div class="text-center mb-4">
                            <div class="position-relative d-inline-block">
                                <canvas id="canvas" class="display-canvas" width="353" height="89"></canvas>
                                <span class="position-absolute top-0 end-0 badge bg-secondary m-2">Slot: <span id="slotId">-</span></span>
                            </div>
                        </div>

                        <!-- Plugins Grid -->
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h5 class="mb-0">Plugins</h5>
                                <small class="text-muted">Click to edit, drag to reorder</small>
                            </div>
                            <div id="divSlots" class="slot-grid">
                            </div>
                        </div>

                        <!-- Uninstall Zone -->
                        <div id="uninstallZone" class="uninstall-zone mb-3" ondragover="allowDrop(event)" ondrop="drop(event)">
                            Drop here to uninstall
                        </div>
                    </div>

                    <!-- Side Panel - Controls -->
                    <div class="col-lg-3 col-md-4">
                        <div class="side-panel">
                            <!-- Display Controls -->
                            <div class="card mb-3">
                                <div class="card-header py-2">Display</div>
                                <div class="card-body py-2">
                                    <div class="d-grid gap-2">
                                        <button id="displayPowerButton" class="btn btn-outline-light btn-sm" type="button" onclick="triggerDisplayState()" value="off" disabled>
                                            Power Off
                                        </button>
                                        <button id="updateDisplayButton" class="btn btn-outline-light btn-sm" type="button" onclick="updateDisplay()" value="false" disabled>
                                            Auto Update
                                        </button>
                                        <div class="btn-group btn-group-sm">
                                            <button class="btn btn-outline-light" type="button" onclick="prevSlot()" disabled>Prev</button>
                                            <button class="btn btn-outline-light" type="button" onclick="nextSlot()" disabled>Next</button>
                                        </div>
                                        <button class="btn btn-outline-light btn-sm" id="bNextEffect" type="button" onclick="nextEffect()" disabled>
                                            Effect: <span id="lableFadeEffect" class="text-primary">Linear</span>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Brightness -->
                            <div class="card mb-3">
                                <div class="card-header py-2 d-flex justify-content-between align-items-center">
                                    <span>Brightness</span>
                                    <div class="form-check form-switch mb-0">
                                        <input class="form-check-input" type="checkbox" id="autoBrightnessSwitch" onchange="toggleAutoBrightness()" disabled>
                                        <label class="form-check-label small" for="autoBrightnessSwitch">Auto</label>
                                    </div>
                                </div>
                                <div class="card-body py-2">
                                    <div class="mb-2">
                                        <div class="d-flex justify-content-between small">
                                            <label for="currentBrightness">Current</label>
                                            <span id="currentBrightnessValue">?</span>
                                        </div>
                                        <input type="range" class="form-range" id="currentBrightness" min="0" max="255" onchange="changeBrightness();" oninput="$('#currentBrightnessValue').text(calcPercentage(this.value) + '%')" disabled />
                                    </div>
                                    <div class="mb-2">
                                        <div class="d-flex justify-content-between small">
                                            <label for="minBrightness">Min</label>
                                            <span id="minBrightnessValue">?</span>
                                        </div>
                                        <input type="range" class="form-range" id="minBrightness" min="0" max="255" onchange="changeBrightness();" oninput="$('#minBrightnessValue').text(calcPercentage(this.value) + '%')" disabled />
                                    </div>
                                    <div>
                                        <div class="d-flex justify-content-between small">
                                            <label for="maxBrightness">Max</label>
                                            <span id="maxBrightnessValue">?</span>
                                        </div>
                                        <input type="range" class="form-range" id="maxBrightness" min="0" max="255" onchange="changeBrightness();" oninput="$('#maxBrightnessValue').text(calcPercentage(this.value) + '%')" disabled />
                                    </div>
                                </div>
                            </div>

                            <!-- Add Plugin -->
                            <div class="card mb-3">
                                <div class="card-header py-2">Add Plugin</div>
                                <div class="card-body py-2">
                                    <select class="form-select form-select-sm mb-2" id="pluginToInstall" size="1">
                                    </select>
                                    <button class="btn btn-primary btn-sm w-100" type="button" onclick="install()" disabled>Install</button>
                                </div>
                            </div>

                            <!-- Legend -->
                            <div class="card">
                                <div class="card-body py-2 small">
                                    <div><span class="text-danger">Red</span> = Locked</div>
                                    <div><span class="text-warning">S badge</span> = Sticky</div>
                                    <div class="text-muted">Faded = Disabled</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2025 (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- jQuery, and Bootstrap JS bundle -->
        <script type="text/javascript" src="/js/jquery-3.7.1.slim.min.js"></script>
        <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
        <!-- Pixelix websocket library -->
        <script type="text/javascript" src="/js/ws.js"></script>
        <script type="text/javascript" src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.js"></script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/menu.js"></script>
        <script type="text/javascript" src="/js/pluginsSubMenu.js"></script>
        <script type="text/javascript" src="/js/servicesSubMenu.js"></script>
        <!-- Pixelix utilities -->
        <script type="text/javascript" src="/js/utils.js"></script>
        <script type="text/javascript" src="/js/dialog.js"></script>
        <!-- Pixelix REST API -->
        <script type="text/javascript" src="/js/rest.js"></script>
        <!-- Pixelix drag'n drop -->
        <script type="text/javascript" src="/js/dragDropTouch.js"></script>

        <!-- Custom javascript -->
        <script>
            var ctx                 = null;     // Canvas context
            var timerId             = 0;        // Timer id
            var period              = 400;      // Display refresh period in ms
            var wsClient            = new pixelix.ws.Client();
            var restClient          = new pixelix.rest.Client();
            var isPageUnload        = false;
            var plugins             = [];       // List of all available plugins
            var currentFadeEffect   = 0         // Fade effect [1;3]
            
            const PIXEL_WIDTH       = 10;               // Width of a single LED in pixels
            const PIXEL_HEIGTH      = 10;               // Height of a single LED in pixels
            const DISPLAY_WIDTH     = ~DISPLAY_WIDTH~;  // Width in pixels (Updated by webserver on send)
            const DISPLAY_HEIGHT    = ~DISPLAY_HEIGHT~; // Height in pixels (Updated by webserver on send)

            const CANVAS_WIDTH      = (DISPLAY_WIDTH) * PIXEL_WIDTH + (DISPLAY_WIDTH) + 1;
            const CANVAS_HEIGHT     = (DISPLAY_HEIGHT) * PIXEL_HEIGTH + (DISPLAY_HEIGHT) + 1;

            /* Disable all UI elements. */
            function disableUI() {
                $("main :button").prop("disabled", true);
                $("main :input").prop("disabled", true);
            }

            /* Enable all UI elements. */
            function enableUI() {
                var automaticBrightnessControl = $("#autoBrightnessSwitch").prop("checked");

                $("main :button").prop("disabled", false);
                $("main :input").prop("disabled", false);

                if (true == automaticBrightnessControl) {
                    $("#currentBrightness").prop("disabled", true);
                }
            }

            /* If websocket connection is unexpectedly closed, clean up. */
            function wsOnClosed() {
                disableUI();

                window.clearTimeout(timerId);

                if (false === isPageUnload) {
                    dialog.showError("<p>Websocket connection closed.</p>");
                }
            }

            function plot(x, y, color) {
                if (null !== ctx) {
                    ctx.lineWidth   = "1";
                    ctx.strokeStyle = color;
                    ctx.fillStyle   = color;
                    ctx.fillRect(x * PIXEL_WIDTH + x + 1, y * PIXEL_HEIGTH + y + 1, PIXEL_WIDTH, PIXEL_HEIGTH);
                }
            }

            function getDisplayContent() {
                wsClient.getDisplayContent().then(function(rsp) {
                    let index   = 0;              // Index in input sequence.
                    let pixelIndex = 0;           // Index as pixel offset from framebuffer start.
                    
                    $("#slotId").text(rsp.slotId);

                    /* If necessary, resize the canvas. */
                    var $canvas = $("#canvas");
                    var ctx = $canvas[0].getContext('2d');

                    if ((ctx.canvas.width != CANVAS_WIDTH) || (ctx.canvas.height != CANVAS_HEIGHT)) {
                        ctx.canvas.width = CANVAS_WIDTH;
                        ctx.canvas.height = CANVAS_HEIGHT;
                    }                  

                    /* Handle display data */
                    while (index < rsp.data.length) {
                        let color   = rsp.data[index];
                        let repeat  = (color & 0xFF000000) >>> 24;
                        let red     = (color & 0x00FF0000) >>> 16;
                        let green   = (color & 0x0000FF00) >>> 8;
                        let blue    = (color & 0x000000FF) >>> 0;
                        let colFmt  = "rgb(" + red + ", " + green + ", " + blue + ")";

                        do {
                            let x = pixelIndex % DISPLAY_WIDTH;
                            let y = Math.floor(pixelIndex / DISPLAY_WIDTH);
                            
                            plot(x, y, colFmt);

                            --repeat;
                            ++pixelIndex;
                        } while (repeat >= 0);
                        ++index;
                    }
                    
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                }).finally(function() {
                    var isDisplayUpdateOn = $("#updateDisplayButton").val();

                    if ("true" === isDisplayUpdateOn) {
                        /* Start next update timer. */
                        timerId = window.setTimeout(getDisplayContent, period);
                    }
                });

                return;
            }

            function install() {
                var pluginIndex = parseInt($("#pluginToInstall").val());
                var pluginName  = plugins[pluginIndex];

                disableUI();

                return wsClient.install({
                    pluginName: pluginName
                }).then(function(rsp) {
                    return updateSlotInfo();
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Install " + pluginName + " failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            function uninstall(slotId) {
                disableUI();

                return wsClient.uninstall({
                    slotId: slotId
                }).then(function(rsp) {
                    return updateSlotInfo();
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Uninstall slot " + slotId + " failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            function nextEffect() {
               return wsClient.setFadeEffect({
                fadeEffect:(currentFadeEffect + 1)
            }).then(function(rsp) {
                    currentFadeEffect = rsp.fadeEffect;
                    updateFadeEffect();
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Failed.</p>");
                }).finally(function() {
                });
            }

            function updateFadeEffect() {
                /* Update label accordingly. */
                if (0 === currentFadeEffect) {
                    $("#lableFadeEffect").text("None");
                }
                else if (1 === currentFadeEffect) {
                    $("#lableFadeEffect").text("Linear");
                }
                else if (2 === currentFadeEffect) {
                    $("#lableFadeEffect").text("MoveX");
                }
                else if (3 === currentFadeEffect) {
                    $("#lableFadeEffect").text("MoveY");
                }
                else {
                    $("#lableFadeEffect").text("Unknown");
                }
            }

            function prevSlot() {
                var buttonActionIdPrevSlot = 2; /* See ButtonActionId */
                disableUI();

                return wsClient.triggerButton({"actionId": buttonActionIdPrevSlot}).then(function(rsp) {
                    /* Nothing to do */
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            function nextSlot() {
                var buttonActionIdNextSlot = 1; /* See ButtonActionId */
                disableUI();

                return wsClient.triggerButton({"actionId": buttonActionIdNextSlot}).then(function(rsp) {
                    /* Nothing to do */
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            function updateDisplay() {
                var isDisplayUpdateOn = $("#updateDisplayButton").val();

                disableUI();

                /* Currently off? */
                if ("false" === isDisplayUpdateOn) {
                    timerId = window.setTimeout(getDisplayContent, period);
                    $("#updateDisplayButton").text("Disable auto. display update");
                    $("#updateDisplayButton").val("true");
                } else {
                    window.clearTimeout(timerId);
                    $("#updateDisplayButton").text("Enable auto. display update");
                    $("#updateDisplayButton").val("false");
                }

                enableUI();
            }

            function updatetDisplayState() {
                return restClient.getDisplayState().then(function(rsp) {
                    $("#displayPowerButton").val(rsp.data.state);
                    $("#displayPowerButton").text(("off" === rsp.data.state) ? "Power On" : "Power Off");
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Failed.</p>");
                });
            }

            function triggerDisplayState() {
                var powerState = $("#displayPowerButton").val();

                if ("off" === powerState) {
                    powerState = "on";
                } else {
                    powerState = "off";
                }

                disableUI();

                return restClient.setDisplayState(powerState).then(function(rsp) {
                    $("#displayPowerButton").val(powerState);
                    $("#displayPowerButton").text("off" === powerState ? "Power On" : "Power Off");
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            function move(uid, slotId) {
                return wsClient.move({
                    uid: uid,
                    slotId: slotId
                }).then(function(rsp) {
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Moving failed.</p>");
                }).finally(function() {
                    return updateSlotInfo();
                });
            }

            function allowDrop(ev) {
                ev.preventDefault();
            }

            function drag(ev) {
                var $card = $(ev.target).closest(".slot-card");
                $card.addClass("dragging");
                var slotId = $card.data("slot");
                var uid = $card.data("uid");
                ev.dataTransfer.setData("slotId", slotId);
                ev.dataTransfer.setData("uid", uid);
            }

            function onDragEnd(ev) {
                $(ev.target).closest(".slot-card").removeClass("dragging");
            }

            function drop(ev) {
                ev.preventDefault();

                var srcSlotId = parseInt(ev.dataTransfer.getData("slotId"));
                var srcUid = parseInt(ev.dataTransfer.getData("uid"));
                var target = ev.currentTarget;

                // Check if dropping on uninstall zone
                if ("uninstallZone" === target.id) {
                    uninstall(srcSlotId);
                } else {
                    // Dropping on another slot card
                    var $targetCard = $(target).closest(".slot-card");
                    var targetSlotId = $targetCard.data("slot");

                    if (srcSlotId !== targetSlotId) {
                        // Move plugin UID to target slot
                        move(srcUid, targetSlotId);
                    }
                }
            }

            function setDuration(slotId) {
                var duration = parseInt($("#duration" + slotId).val()) * 1000;

                return wsClient.setSlotDuration({
                    slotId: slotId,
                    duration: duration
                }).then(function(rsp) {
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Set duration failed.</p>");
                }).finally(function() {
                    return updateSlotInfo();
                });
            }

            function setAlias(pluginUid) {
                var alias = $("#alias" + pluginUid).val();

                return wsClient.setPluginAlias({
                    uid: pluginUid,
                    name: alias
                }).then(function(rsp) {
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Set alias failed.</p>");
                }).finally(function() {
                    return updateSlotInfo();
                });
            }

            function getPluginImagePath(pluginName) {
                // Try to get plugin image - most are .jpg, some are .png
                return "/plugins/" + pluginName + "/" + pluginName + ".jpg";
            }

            function toggleCardExpand(cardId) {
                var $card = $("#" + cardId).closest(".slot-card");
                $card.toggleClass("expanded");
            }

            function updateSlotInfo() {
                return wsClient.getSlots().then(function(rsp) {
                    var index = 0;
                    var $divSlots = $("#divSlots");

                    $divSlots.empty();

                    for(index = 0; index < rsp.slots.length; ++index) {
                        var slot = rsp.slots[index];

                        // Skip empty slots
                        if (0 === slot.name.length) {
                            continue;
                        }

                        var pluginName = slot.name;
                        var pluginUid = slot.uid;
                        var pluginAlias = (0 < slot.alias.length) ? slot.alias : "";
                        var displayName = pluginAlias.length > 0 ? pluginAlias : pluginName.replace("Plugin", "");

                        // Build card classes
                        var cardClasses = "slot-card";
                        if (slot.isLocked) cardClasses += " is-locked";
                        if (slot.isSticky) cardClasses += " is-sticky";
                        if (slot.isDisabled) cardClasses += " is-disabled";

                        // Create slot card
                        var $card = $("<div>")
                            .attr("class", cardClasses)
                            .attr("id", "slot-" + index)
                            .attr("data-slot", index)
                            .attr("data-uid", pluginUid);

                        // Make draggable if not locked
                        if (!slot.isLocked) {
                            $card.attr("draggable", "true");
                            $card.attr("ondragstart", "drag(event)");
                            $card.attr("ondragend", "onDragEnd(event)");
                            $card.attr("ondragover", "allowDrop(event)");
                            $card.attr("ondrop", "drop(event)");
                        }

                        // Plugin image
                        var $img = $("<img>")
                            .attr("class", "slot-card-image")
                            .attr("src", getPluginImagePath(pluginName))
                            .attr("alt", pluginName)
                            .attr("onerror", "this.style.display='none'; this.nextElementSibling.style.display='flex';");

                        var $imgPlaceholder = $("<div>")
                            .attr("class", "slot-card-image-placeholder")
                            .attr("style", "display:none;")
                            .text(pluginName.charAt(0));

                        $card.append($img);
                        $card.append($imgPlaceholder);

                        // Card info
                        var $info = $("<div>")
                            .attr("class", "slot-card-info")
                            .attr("onclick", "toggleCardExpand('slot-" + index + "')");

                        $info.append($("<div>").attr("class", "slot-card-name").text(displayName));
                        $info.append($("<div>").attr("class", "slot-card-slot").text("Slot " + index));

                        $card.append($info);

                        // Expandable controls
                        var $controls = $("<div>").attr("class", "slot-card-controls");

                        // Duration
                        var $durationGroup = $("<div>").attr("class", "input-group input-group-sm mb-2");
                        $durationGroup.append($("<span>").attr("class", "input-group-text").text("Time"));
                        $durationGroup.append(
                            $("<input>")
                                .attr("class", "form-control form-control-sm")
                                .attr("id", "duration" + index)
                                .attr("type", "number")
                                .attr("value", slot.duration / 1000)
                                .attr("min", "1")
                                .attr("max", "3600")
                                .attr("onchange", "setDuration(" + index + ")")
                        );
                        $durationGroup.append($("<span>").attr("class", "input-group-text").text("s"));
                        $controls.append($durationGroup);

                        // Alias
                        var $aliasGroup = $("<div>").attr("class", "input-group input-group-sm mb-2");
                        $aliasGroup.append($("<span>").attr("class", "input-group-text").text("Alias"));
                        $aliasGroup.append(
                            $("<input>")
                                .attr("class", "form-control form-control-sm")
                                .attr("id", "alias" + pluginUid)
                                .attr("type", "text")
                                .attr("value", pluginAlias)
                                .attr("placeholder", "Name")
                                .attr("maxlength", "8")
                                .attr("onchange", "setAlias(" + pluginUid + ")")
                        );
                        $controls.append($aliasGroup);

                        // Buttons
                        var $btnGroup = $("<div>").attr("class", "d-flex gap-1");
                        $btnGroup.append(
                            $("<button>")
                                .attr("class", "btn btn-outline-secondary btn-sm flex-fill")
                                .attr("id", "sticky" + index)
                                .attr("onclick", "handleStickySlot(" + index + ")")
                                .text(slot.isSticky ? "Unsticky" : "Sticky")
                        );
                        $btnGroup.append(
                            $("<button>")
                                .attr("class", "btn btn-outline-secondary btn-sm flex-fill")
                                .attr("id", "slotStatus" + index)
                                .attr("onclick", "handleSlotStatus(" + index + ")")
                                .text(slot.isDisabled ? "Enable" : "Disable")
                        );
                        $controls.append($btnGroup);

                        $card.append($controls);
                        $divSlots.append($card);
                    }

                    // Show message if no plugins installed
                    if ($divSlots.children().length === 0) {
                        $divSlots.append(
                            $("<div>")
                                .attr("class", "text-center text-muted py-4")
                                .html("<p>No plugins installed</p><p class='small'>Use the Add Plugin panel to install plugins</p>")
                        );
                    }
                });
            }

            function handleSlotStatus(slotId) {
                var statusStr = $("#slotStatus" + slotId).text();
                var isDisabled = (statusStr === "Enable") ? false : true;

                disableUI();
                
                return wsClient.setSlot({
                    slotId: slotId,
                    isDisabled: isDisabled
                }).then(function(rsp) {
                    return updateSlotInfo();
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            function handleStickySlot(slotId) {
                var stickyStr = $("#sticky" + slotId).text();
                var sticky = (stickyStr === "Sticky") ? true : false;

                disableUI();
                
                return wsClient.setSlot({
                    slotId: slotId,
                    sticky: sticky
                }).then(function(rsp) {
                    return updateSlotInfo();
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            function calcPercentage(value) {
                return (value * 100 / 255).toFixed(1);
            }

            function updateCurrentBrightness(brightness) {
                var brightnessInPercent = calcPercentage(brightness);
                $("#currentBrightnessValue").text("" + brightnessInPercent + " %");
                $("#currentBrightness").val(brightness);
            }

            function updateMinBrightness(minBrightness) {
                var minBrightnessInPercent = calcPercentage(minBrightness);
                $("#minBrightnessValue").text("" + minBrightnessInPercent + " %");
                $("#minBrightness").val(minBrightness);
            }

            function updateMaxBrightness(maxBrightness) {
                var maxBrightnessInPercent = calcPercentage(maxBrightness);
                $("#maxBrightnessValue").text("" + maxBrightnessInPercent + " %");
                $("#maxBrightness").val(maxBrightness);
            }

            function updateAutoBrightnessCtrl(autoBrightnessCtrl) {
                if (false === autoBrightnessCtrl) {
                    $("#autoBrightnessSwitch").prop("checked", false);
                    $("#currentBrightness").prop("disabled", false);
                } else {
                    $("#autoBrightnessSwitch").prop("checked", true);
                    $("#currentBrightness").prop("disabled", true);
                }
            }

            function toggleAutoBrightness() {
                changeBrightness();
            }

            function changeBrightness() {
                var currentBrightness = parseInt($("#currentBrightness").val());
                var minBrightness = parseInt($("#minBrightness").val());
                var maxBrightness = parseInt($("#maxBrightness").val());
                var autoBrightnessCtrl = $("#autoBrightnessSwitch").prop("checked");

                disableUI();
                wsClient.setBrightness({
                    brightness: currentBrightness,
                    minBrightness: minBrightness,
                    maxBrightness: maxBrightness,
                    automaticBrightnessControl: autoBrightnessCtrl
                }).then(function(rsp) {
                    updateCurrentBrightness(rsp.brightness);
                    updateMinBrightness(rsp.minBrightness);
                    updateMaxBrightness(rsp.maxBrightness);
                    updateAutoBrightnessCtrl(rsp.automaticBrightnessControl);
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                    return dialog.showError("<p>Changing brightness failed.</p>");
                }).finally(function() {
                    enableUI();
                });
            }

            /* Execute after page is ready. */
            $(document).ready(function() {
                var displayCanvas = document.getElementById("canvas");
                ctx = displayCanvas.getContext("2d");

                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                /* Connect to pixelix */
                wsClient.connect({
                    protocol: "~WS_PROTOCOL~",
                    hostname: location.hostname,
                    port: parseInt("~WS_PORT~"),
                    endpoint: "~WS_ENDPOINT~",
                    onClosed: wsOnClosed
                }).then(function(rsp) {
                    /* Get list of available plugins */
                    return wsClient.getPlugins();
                }).then(function(rsp) {
                    var index = 0;

                    /* Store plugin list */
                    plugins = rsp.plugins;

                    /* Update plugin dropdown list */
                    for(index = 0; index < plugins.length; ++index) {
                        $("<option>").val(index).text(plugins[index]).appendTo("#pluginToInstall");
                    }

                    /* Update the slot informations, shown to user. */
                    return updateSlotInfo();
                }).then(function(rsp) {
                    /* Get brightness information */
                    return wsClient.getBrightness();
                }).then(function(rsp) {
                    updateCurrentBrightness(rsp.brightness);
                    updateMinBrightness(rsp.minBrightness);
                    updateMaxBrightness(rsp.maxBrightness);
                    updateAutoBrightnessCtrl(rsp.automaticBrightnessControl);
                }).then(function(rsp) {
                    /* Get fadeEffect information */
                    return wsClient.getFadeEffect();
                }).then(function(rsp) {
                    currentFadeEffect = rsp.fadeEffect;
                    updateFadeEffect();
                }).then(function(rsp) {
                    /* Update display state */
                    return updatetDisplayState();
                }).then(function(rsp) {
                    /* UI is enabled at least. */
                    enableUI();
                }).catch(function(err) {
                    if ("undefined" !== typeof err) {
                        console.error(err);
                    }
                });
            });

            /* If the page is left, there shall be no message shown regarding
             * unexpected websocket lost.
             */
             $(window).bind("beforeunload", function() {
                isPageUnload = true;

                if (null !== wsClient) {
                    wsClient.disconnect();
                }
            });
        </script>
    </body>
</html>
