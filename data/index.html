<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link rel="stylesheet" type="text/css" href="/style/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/style/sticky-footer-navbar.css" />
        <link rel="stylesheet" type="text/css" href="/style/style.css" />

        <title>PIXELIX - Shryock Edition</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>
    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav mr-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <div class="container-fluid px-4">
                <div class="row justify-content-center">
                    <div class="col-lg-6 col-md-8">
                        <!-- Welcome Card -->
                        <div class="card text-center mt-4">
                            <div class="card-body py-4">
                                <img src="/images/Logo.png" alt="Pixelix" class="mb-3" style="max-width: 200px;" />
                                <span class="badge bg-info mb-2">Shryock Edition</span>
                                <h4 class="text-primary mb-3">~HOSTNAME~</h4>
                            </div>
                        </div>

                        <!-- Version Info Card -->
                        <div class="card mt-3">
                            <div class="card-header py-2">System Info</div>
                            <div class="card-body py-2">
                                <table class="table table-sm table-borderless mb-0 small">
                                    <tr>
                                        <td class="text-muted">Version</td>
                                        <td class="text-end">~SW_VERSION~</td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Revision</td>
                                        <td class="text-end text-truncate" style="max-width: 150px;" title="~SW_REVISION~">~SW_REVISION~</td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Branch</td>
                                        <td class="text-end">~SW_BRANCH~</td>
                                    </tr>
                                    <tr>
                                        <td class="text-muted">Target</td>
                                        <td class="text-end">~TARGET~</td>
                                    </tr>
                                </table>
                            </div>
                        </div>

                        <!-- Quick Links -->
                        <div class="card mt-3">
                            <div class="card-header py-2">Quick Links</div>
                            <div class="card-body py-3">
                                <div class="d-grid gap-2">
                                    <a href="/display.html" class="btn btn-outline-primary btn-sm">Display</a>
                                    <a href="/settings.html" class="btn btn-outline-secondary btn-sm">Settings</a>
                                    <a href="/info.html" class="btn btn-outline-secondary btn-sm">System Info</a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2025 (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- jQuery, and Bootstrap JS bundle -->
        <script type="text/javascript" src="/js/jquery-3.7.1.slim.min.js"></script>
        <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/menu.js"></script>
        <script type="text/javascript" src="/js/pluginsSubMenu.js"></script>
        <script type="text/javascript" src="/js/servicesSubMenu.js"></script>

        <script>
            $(document).ready(function() {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);
            });
        </script>
    </body>
</html>
