<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link rel="stylesheet" type="text/css" href="/style/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/style/sticky-footer-navbar.css" />
        <link rel="stylesheet" type="text/css" href="/style/style.css" />

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>
    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav mr-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <!-- Dialog -->
            <div class="modal fade" id="modalDialog" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true" data-bs-keyboard="false" data-bs-backdrop="static">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header" id="dialogHeader">
                            <h5 class="modal-title" id="dialogTitle"></h5>
                        </div>
                        <div class="modal-body" id="dialogBody">
                        </div>
                        <div class="modal-footer" id="dialogFooter">
                        </div>
                    </div>
                </div>
            </div>
            <!-- Main view - two column layout -->
            <div class="container-fluid px-4">
                <div class="row">
                    <!-- Main content - Settings -->
                    <div class="col-lg-9 col-md-8">
                        <h4 class="mb-3">Settings</h4>
                        <p class="text-muted small mb-3">Changes require a restart to take effect.</p>
                        <div id="settings" class="settings-grid"></div>
                    </div>

                    <!-- Side Panel - Controls -->
                    <div class="col-lg-3 col-md-4">
                        <div class="side-panel">
                            <!-- System Controls -->
                            <div class="card mb-3">
                                <div class="card-header py-2">System</div>
                                <div class="card-body py-2">
                                    <div class="d-grid gap-2">
                                        <button class="btn btn-outline-warning btn-sm" type="button" onclick="restart();" disabled>
                                            Restart Device
                                        </button>
                                        <button class="btn btn-outline-danger btn-sm" type="button" onclick="shutdown();" disabled>
                                            Shutdown
                                        </button>
                                    </div>
                                </div>
                            </div>

                            <!-- Info -->
                            <div class="card">
                                <div class="card-body py-2 small text-muted">
                                    <div>Total settings: <span id="settingsCount">0</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2025 (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- jQuery, and Bootstrap JS bundle -->
        <script type="text/javascript" src="/js/jquery-3.7.1.slim.min.js"></script>
        <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/menu.js"></script>
        <script type="text/javascript" src="/js/pluginsSubMenu.js"></script>
        <script type="text/javascript" src="/js/servicesSubMenu.js"></script>
        <!-- Pixelix utilities -->
        <script type="text/javascript" src="/js/utils.js"></script>
        <script type="text/javascript" src="/js/dialog.js"></script>
        <!-- Pixelix REST API -->
        <script type="text/javascript" src="/js/rest.js"></script>

        <!-- Custom javascript -->
        <script>
            var restClient  = new pixelix.rest.Client();
            var data = [];

            /* Disable all UI elements. */
            function disableUI() {
                $("main :button").prop("disabled", true);
            }

            /* Enable all UI elements. */
            function enableUI() {
                $("main :button").prop("disabled", false);
            }

            function restart() {
                disableUI();

                restClient.restart().then(function(rsp) {
                    return dialog.showInfo("<p>Ok.</p>");
                }).catch(function(err) {
                    return dialog.showError("<p>Error: " + err + "</p>");
                });
            }

            function shutdown() {
                disableUI();

                restClient.shutdown().then(function(rsp) {
                    return dialog.showInfo("<p>Shutting down. Press reset button to wake up.</p>");
                }).catch(function(err) {
                    return dialog.showError("<p>Error: " + err + "</p>");
                });
            }

            function store(id) {
                var $input = $("#" + id);
                var index = parseInt(id.substring(8));
                var value = null;

                if ("checkbox" === $input.attr("type")) {
                    value = $input.is(":checked");
                } else {
                    value = $input.val();
                }

                restClient.setSetting(data[index].key, value).then(function(rsp) {
                    return dialog.showInfo("<p>Successful stored.</p>");
                }).catch(function(rsp) {
                    return dialog.showError("<p>Error: " + rsp.error.msg + "</p>");
                });
            }

            $(document).ready(function() {
                var index = 0;

                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                restClient.getSettingKeys().then(function(result) {
                    var promise = null;
                    var promises = []
                    var index = 0;

                    for(index = 0; index < result.data.settings.length; ++index) {
                        promise = restClient.getSettingByKey(result.data.settings[index]).then(function(result) {
                            data.push(result.data);
                            return Promise.resolve();
                        });

                        promises.push(promise);
                    }

                    return Promise.all(promises);
                }).then(function() {
                    var $card       = null;
                    var $cardBody   = null;
                    var $label      = null;
                    var $inputGroup = null;
                    var $formCheck  = null;
                    var $inputField = null;
                    var $button     = null;

                    // Update settings count
                    $("#settingsCount").text(data.length);

                    for(index = 0; index < data.length; ++index) {
                        // Create card
                        $card = $("<div>").attr("class", "setting-card");
                        $cardBody = $("<div>").attr("class", "setting-card-body");

                        $label = $("<label>")
                                .attr("for", "setting-" + index)
                                .attr("class", "setting-label")
                                .text(data[index].name);

                        if ("string" === typeof data[index].value) {
                            var inputFieldType = "text";
                            if ("boolean" === typeof data[index].isSecret) {
                                if (true === data[index].isSecret) {
                                    inputFieldType = "password";
                                }
                            }

                            $inputField = $("<input>")
                                    .attr("class", "form-control form-control-sm")
                                    .attr("id", "setting-" + index)
                                    .attr("type", inputFieldType)
                                    .attr("minlength", data[index].minlength)
                                    .attr("maxlength", data[index].maxlength)
                                    .val(data[index].value);

                        } else if ("number" === typeof data[index].value) {
                            $inputField = $("<input>")
                                    .attr("class", "form-control form-control-sm")
                                    .attr("id", "setting-" + index)
                                    .attr("type", "number")
                                    .attr("min", data[index].min)
                                    .attr("max", data[index].max)
                                    .val(data[index].value);

                        } else if ("boolean" === typeof data[index].value) {
                            $inputField = $("<div>").attr("class", "form-check form-switch");
                            var $checkbox = $("<input>")
                                    .attr("class", "form-check-input")
                                    .attr("id", "setting-" + index)
                                    .attr("type", "checkbox")
                                    .attr("role", "switch");

                            if (true === data[index].value) {
                                $checkbox.attr("checked", true);
                            }

                            $inputField.append($checkbox);
                            $formCheck = true;

                        } else if ("object" === typeof data[index].value) {
                            $inputField = $("<textarea>")
                                    .attr("class", "form-control form-control-sm font-monospace")
                                    .attr("id", "setting-" + index)
                                    .attr("rows", 8)
                                    .attr("minlength", data[index].minlength)
                                    .attr("maxlength", data[index].maxlength)
                                    .val(JSON.stringify(data[index].value, null, 2));

                        } else {
                            console.error("Data type " + typeof data[index].value + " not handled.");
                        }

                        $button = $("<button>")
                                .attr("class", "btn btn-primary btn-sm")
                                .attr("onclick", "store(\"setting-" + index + "\");")
                                .text("Save");

                        // Build input group with button
                        if ($formCheck) {
                            $inputGroup = $("<div>").attr("class", "d-flex justify-content-between align-items-center");
                            $inputGroup.append($inputField);
                            $inputGroup.append($button);
                        } else {
                            $inputGroup = $("<div>").attr("class", "input-group input-group-sm");
                            $inputGroup.append($inputField);
                            $inputGroup.append($button);
                        }

                        $cardBody.append($label);
                        $cardBody.append($inputGroup);
                        $card.append($cardBody);

                        $("#settings").append($card);

                        /* Reset */
                        $formCheck = null;
                    }
                }).then(function() {
                    enableUI();
                }).catch(function(err) {
                    return dialog.showError("<p>Error: " + err + "</p>");
                });
            });
        </script>
    </body>
</html>
