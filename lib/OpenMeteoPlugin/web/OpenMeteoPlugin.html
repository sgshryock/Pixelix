<!doctype html>
<html lang="en" data-bs-theme="dark">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

        <!-- Styles -->
        <link rel="stylesheet" type="text/css" href="/style/bootstrap.min.css" />
        <link rel="stylesheet" type="text/css" href="/style/sticky-footer-navbar.css" />
        <link rel="stylesheet" type="text/css" href="/style/style.css" />

        <title>PIXELIX</title>
        <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    </head>
    <body class="d-flex flex-column h-100">
        <header>
            <!-- Fixed navbar -->
            <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
                <a class="navbar-brand" href="/index.html">
                    <img src="/images/LogoSmall.png" alt="PIXELIX" />
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse" aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarCollapse">
                    <ul class="navbar-nav mr-auto" id="menu">
                    </ul>
                </div>
            </nav>
        </header>

        <!-- Begin page content -->
        <main role="main" class="flex-shrink-0">
            <div class="container-fluid px-4">
                <div class="row">
                    <!-- Left column - Plugin info -->
                    <div class="col-lg-4">
                        <div class="card mb-3">
                            <div class="card-header py-2 d-flex justify-content-between align-items-center">
                                <span>OpenMeteoPlugin</span>
                                <span class="badge bg-info">Weather</span>
                            </div>
                            <div class="card-body py-2">
                                <img src="OpenMeteoPlugin.jpg" alt="Screenshot" class="img-fluid rounded mb-2" />
                                <p class="small mb-1">Shows current weather from <a href="https://open-meteo.com" target="_blank">Open-Meteo</a>.</p>
                                <p class="small mb-0">Displays icon, temperature, and additional info.</p>
                            </div>
                        </div>
                    </div>
                    <!-- Right column - Configuration -->
                    <div class="col-lg-8">
                        <div class="card mb-3">
                            <div class="card-header py-2">Configuration</div>
                            <div class="card-body py-2">
                                <form id="myForm" action="javascript:setConfig(pluginUid.options[pluginUid.selectedIndex].value)">
                                    <div class="row">
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small" for="pluginUid">Plugin UID</label>
                                            <select class="form-select form-select-sm" id="pluginUid" onChange="getConfig(pluginUid.options[pluginUid.selectedIndex].value)">
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small" for="updatePeriod">Update (min)</label>
                                            <input class="form-control form-control-sm" type="number" id="updatePeriod" name="updatePeriod" value="10" min="1" max="120" />
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small" for="latitude">Latitude</label>
                                            <input class="form-control form-control-sm" type="text" id="latitude" name="latitude" />
                                        </div>
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small" for="longitude">Longitude</label>
                                            <input class="form-control form-control-sm" type="text" id="longitude" name="longitude" />
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small" for="temperatureUnit">Temperature Unit</label>
                                            <select class="form-select form-select-sm" id="temperatureUnit">
                                                <option value="celsius">Celsius</option>
                                                <option value="fahrenheit">Fahrenheit</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small" for="windSpeedUnit">Wind Speed Unit</label>
                                            <select class="form-select form-select-sm" id="windSpeedUnit">
                                                <option value="ms">m/s</option>
                                                <option value="kmh">km/h</option>
                                                <option value="mph">mph</option>
                                                <option value="kn">kn</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small">Display Info</label>
                                            <div class="d-flex flex-wrap gap-3">
                                                <div class="form-check form-check-inline">
                                                    <input class="form-check-input" type="checkbox" id="temperature" name="weatherInfo" value="1" />
                                                    <label class="form-check-label small" for="temperature">Temp</label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <input class="form-check-input" type="checkbox" id="humidity" name="weatherInfo" value="2" />
                                                    <label class="form-check-label small" for="humidity">Humidity</label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <input class="form-check-input" type="checkbox" id="windSpeed" name="weatherInfo" value="4" />
                                                    <label class="form-check-label small" for="windSpeed">Wind</label>
                                                </div>
                                                <div class="form-check form-check-inline">
                                                    <input class="form-check-input" type="checkbox" id="uvIndex" name="weatherInfo" value="8" />
                                                    <label class="form-check-label small" for="uvIndex">UV</label>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-md-6 mb-2">
                                            <label class="form-label small" for="units">Units</label>
                                            <select class="form-select form-select-sm" id="units">
                                                <option value="metric">Metric</option>
                                                <option value="imperial">Imperial</option>
                                            </select>
                                        </div>
                                    </div>
                                    <button class="btn btn-primary btn-sm" type="submit">Update</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer mt-auto py-3">
            <div class="container">
                <hr />
                <span class="text-secondary">Copyright (c) 2019 - 2025 (web@blue-andi.de)</span><br />
                <span class="text-secondary"><a href="https://github.com/BlueAndi/Pixelix/blob/master/LICENSE">MIT License</a></span>
            </div>
        </footer>

        <!-- jQuery, and Bootstrap JS bundle -->
        <script type="text/javascript" src="/js/jquery-3.7.1.slim.min.js"></script>
        <script type="text/javascript" src="/js/bootstrap.bundle.min.js"></script>
        <!-- Pixelix menu -->
        <script type="text/javascript" src="/js/menu.js"></script>
        <script type="text/javascript" src="/js/pluginsSubMenu.js"></script>
        <script type="text/javascript" src="/js/servicesSubMenu.js"></script>
        <!-- Pixelix utilities -->
        <script type="text/javascript" src="/js/utils.js"></script>
        <!-- Pixelix REST API -->
        <script type="text/javascript" src="/js/rest.js"></script>

        <script>

            var pluginName  = "OpenMeteoPlugin";
            var restClient  = new pixelix.rest.Client();

            function enableUI() {
                utils.enableForm("myForm", true);
            }

            function disableUI() {
                utils.enableForm("myForm", false);
            }

            function getPluginInstances() {
                return restClient.getPluginInstances().then(function(rsp) {
                    var slotIndex   = 0;
                    var cnt         = 0;
                    var $option     = null;
                    var optionText  = ""

                    for(slotIndex = 0; slotIndex < rsp.data.slots.length; ++slotIndex) {
                        if (rsp.data.slots[slotIndex].name === pluginName) {

                            optionText = rsp.data.slots[slotIndex].uid;
                            optionText += " (";

                            if (0 === rsp.data.slots[slotIndex].alias.length) {
                                optionText += "-"
                            } else {
                                optionText += rsp.data.slots[slotIndex].alias
                            }

                            optionText += ")";

                            $option = $("<option>")
                                        .attr("value", "" + rsp.data.slots[slotIndex].uid)
                                        .text(optionText);

                            $("#pluginUid").append($option);

                            ++cnt;
                        }
                    }

                    return Promise.resolve(cnt);
                }).catch(function(rsp) {
                    alert("Internal error.");
                    return Promise.resolve(0);
                });
            };

            function setWeatherInfo(value) {
                var idx;

                if (value & 0x01) {
                    $("#temperature").prop('checked', true);
                } else {
                    $("#temperature").prop('checked', false);
                }

                if (value & 0x02) {
                    $("#humidity").prop('checked', true);
                } else {
                    $("#humidity").prop('checked', false);
                }

                if (value & 0x04) {
                    $("#windSpeed").prop('checked', true);
                } else {
                    $("#windSpeed").prop('checked', false);
                }

                if (value & 0x08) {
                    $("#uvIndex").prop('checked', true);
                } else {
                    $("#uvIndex").prop('checked', false);
                }
            }

            function getConfig(pluginUid) {
                disableUI();
                return utils.makeRequest({
                    method: "GET",
                    url: "/rest/api/v1/display/uid/" + pluginUid + "/omweather",
                    isJsonResponse: true
                }).then(function(rsp) {
                    $("#updatePeriod").val(rsp.data.updatePeriod);
                    $("#latitude").val(rsp.data.latitude);
                    $("#longitude").val(rsp.data.longitude);
                    $("#temperatureUnit").val(rsp.data.temperatureUnit);
                    $("#windSpeedUnit").val(rsp.data.windSpeedUnit);
                    setWeatherInfo(rsp.data.weatherInfo);
                }).catch(function(rsp) {
                    alert("Internal error.");
                }).finally(function() {
                    enableUI();
                });
            }

            function getWeatherInfo() {
                var weatherInfo = 0;
                var $boxes = $('input[name=weatherInfo]:checked');

                $boxes.each(function() {
                    weatherInfo += parseInt(this.value);
                });

                return weatherInfo;
            }

            function setConfig(pluginUid) {
                disableUI();

                return utils.makeRequest({
                    method: "POST",
                    url: "/rest/api/v1/display/uid/" + pluginUid + "/omweather",
                    isJsonResponse: true,
                    parameter: {
                        updatePeriod: $("#updatePeriod").val(),
                        latitude: $("#latitude").val(),
                        longitude: $("#longitude").val(),
                        weatherInfo: getWeatherInfo(),
                        temperatureUnit: $("#temperatureUnit").val(),
                        windSpeedUnit: $("#windSpeedUnit").val()
                    }
                }).then(function(rsp) {
                    alert("Ok.");
                }).catch(function(rsp) {
                    alert("Failed.");
                }).finally(function() {
                    enableUI();
                });
            }

            $(document).ready(function() {
                menu.addSubMenu(menu.data, "Plugins", pluginSubMenu);
                menu.addSubMenu(menu.data, "Services", serviceSubMenu);
                menu.create("menu", menu.data);

                /* Disable all forms, until the plugin instances are loaded. */
                disableUI();

                /* Load all plugin instances. */
                getPluginInstances().then(function(cnt) {
                    var select = document.getElementById("pluginUid");

                    if (0 < cnt) {

                        return getConfig(
                            select.options[select.selectedIndex].value
                        );
                    }
                });
            });
        </script>
    </body>
</html>
